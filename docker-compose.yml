services:
  postgres:
    image: postgres:16
    container_name: aiapp-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: aiapp
      POSTGRES_PASSWORD: aiapp_dev
      POSTGRES_DB: aiapp
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
